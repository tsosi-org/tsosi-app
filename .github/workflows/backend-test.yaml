name: Test Django application

on:
  push:
    branches:
      - main
    paths:
    - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

    
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "backend-test"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Poetry must be installed before setup-python to cache its virtualenv.
      # Keep its version in line with the one generating poetry.lock
      - name: Install Poetry
        run: pipx install poetry==2.4.2
      - name: Set up Python with the cached dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - name: Install Python dependencies
        run: poetry install --no-root
      - name: Create settings file
        run: cp backend_site/settings_local.test.py backend_site/settings_local.py
      - name: Run the Python tests
        run: poetry run pytest --cov=tsosi/data --cov-report term
