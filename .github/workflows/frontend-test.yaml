name: Test correct build of TSOSI Vue.js app

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yaml'
  # Pull requests to main: the job only runs for the ones from dev (see `if`)
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yaml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per branch or pull request: a new push cancels the PR run in progress
concurrency:
  group: frontend-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  frontend-test:
    # CI runs on pushes to main and on pull requests from dev to main
    if: github.event_name != 'pull_request' || github.head_ref == 'dev'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run the unit tests
        run: npm run test

      - name: Build app
        run: npm run build